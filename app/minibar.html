<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wisp bar</title>
<style>
  :root {
    /* the island is its own object — dark glass, never the dashboard's paper */
    --ink: #F4F2FF;
    --ink-soft: rgba(244, 242, 255, 0.62);
    --plum: #8B7CFF;                       /* the mark and the accent */
    --iris: #6D5AE6;
    /* sweep colours encode the activity; wired up in phase 2 */
    --hue-a: #6D5AE6;
    --hue-b: #8B7CFF;
    --hue-c: #A78BFA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: transparent; overflow: hidden;
    font: 14px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none;
  }

  /* ── island: compact pill that morphs open ── */
  /* the window is transparent and bigger than the island; this centres the
     island inside it so the morph grows from the middle */
  body { display: flex; align-items: flex-start; justify-content: center; }
  #island {
    position: relative; margin: 18px 0;   /* matches MARGIN in the script */
    width: 200px; min-height: 34px;        /* dormant; JS springs these */
    border-radius: 999px;
    background: rgba(18, 14, 34, 0.72);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 20px 50px -14px rgba(0, 0, 0, 0.70);
    color: var(--ink);
    overflow: hidden;
  }
  /* the container leads, the content follows 120ms behind — that lag is what
     makes it read as one object deforming instead of a box being resized */
  #island .pill > *, #island #panel { transition: opacity 140ms ease; }
  #island.morphing .pill > *, #island.morphing #panel { opacity: 0; }
  /* the ring is the running border: it belongs to work in progress, not to a
     resting island. At rest it was a permanent violet outline. */
  #island::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    padding: 1.5px; pointer-events: none;
    background: linear-gradient(115deg, var(--hue-a), var(--hue-b) 55%, var(--hue-c));
    opacity: 0;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    transition: opacity .25s ease;
  }
  body[data-state="listening"] #island::before,
  body[data-state="thinking"] #island::before,
  body[data-state="working"] #island::before { opacity: 1; animation: hue 4s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  #island[data-open="1"] { border-radius: 20px; }

  /* pill row — the drag handle */
  /* NOT -webkit-app-region:drag — an OS drag region never delivers a click,
     which is why nothing happened when you clicked the island. The renderer
     drags the window itself (see the pointer handlers below), so the same
     surface can both move and be clicked. */
  .pill {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: grab; min-height: 34px;
  }
  .pill:active { cursor: grabbing; }
  .pill svg { width: 15px; height: 15px; stroke: var(--plum); fill: none;
              stroke-width: 2; flex: none; }
  #ptext { flex: 1; min-width: 0; color: var(--ink-soft); font-size: 13px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body[data-state="thinking"] #ptext, body[data-state="working"] #ptext { color: var(--ink); }

  /* morphing panel (grid-rows trick) */
  #panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.2,.8,.3,1.05); }
  #island[data-open="1"] #panel { grid-template-rows: 1fr; }
  #panel > .inner { overflow: hidden; }

  .row { display: flex; align-items: center; gap: 6px; padding: 2px 12px 10px;
         -webkit-app-region: no-drag; }
  input#q { flex: 1; min-width: 0; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 13px;
    padding: 9px 13px; outline: 0; color: var(--ink); font: inherit; font-size: 13.5px; }
  input#q:focus { border-color: var(--plum); background: rgba(255,255,255,.10); }
  input#q::placeholder { color: rgba(244,242,255,.42); }

  button { appearance: none; border: 0; background: transparent; cursor: pointer;
    width: 32px; height: 32px; border-radius: 11px; padding: 0;
    display: grid; place-items: center; color: var(--ink);
    -webkit-app-region: no-drag;
    transition: background .18s ease, transform .18s cubic-bezier(.2,.8,.3,1.2); }
  button:hover { background: rgba(139, 124, 255, 0.20); transform: translateY(-1px); }
  button:active { transform: scale(.94); }
  button:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  button svg { width: 16px; height: 16px; stroke: currentColor; fill: none;
               stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #mic.live { color: #fff; background: var(--plum); }
  #stop { display: none; color: #FB7185; }
  body[data-state="working"] #stop { display: grid; }

  /* answer card */
  #answer { display: none; margin: 0 12px 10px; padding: 12px 14px;
    border-radius: 14px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); font-size: 13px; line-height: 1.55;
    color: var(--ink);
    max-height: 300px; overflow-y: auto; user-select: text;
    animation: rise .25s cubic-bezier(.2,.8,.3,1.1); }
  /* the reply is markdown, so it is rendered as markdown — it used to be
     dumped in as raw text with **stars** showing */
  #answer p { margin: 0 0 8px; } #answer p:last-child { margin-bottom: 0; }
  #answer strong { font-weight: 650; color: #fff; }
  #answer em { font-style: italic; }
  #answer ul { margin: 0 0 8px; padding-left: 18px; }
  #answer li { margin: 2px 0; }
  #answer h3 { font-size: 13.5px; font-weight: 650; margin: 2px 0 6px; color: #fff; }
  #answer a { color: var(--plum); }
  #answer code { font: 12px "JetBrains Mono", Consolas, ui-monospace, monospace;
    background: rgba(255,255,255,.10); border-radius: 5px; padding: 1px 5px; }
  #answer pre { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px; padding: 9px 11px; overflow-x: auto; margin: 0 0 8px; }
  #answer pre code { background: none; padding: 0; }
  #answer.show { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.985); } }

  .appr { margin: 0 12px 10px; padding: 10px 13px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(139,124,255,.32);
    font-size: 13px; -webkit-app-region: no-drag; animation: rise .25s ease; }
  .appr .who { color: rgba(244,242,255,.55); font-size: 11px; letter-spacing: .03em;
               text-transform: uppercase; margin-bottom: 2px; }
  .appr .what { margin-bottom: 8px; }
  .appr .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .appr .acts button { width: auto; height: 29px; padding: 0 13px; border-radius: 10px;
    font: 600 12.5px/1 Inter, "Segoe UI", system-ui, sans-serif; }
  .appr .allow { background: var(--plum); color: #fff; }
  .appr .retry { border: 1px solid rgba(255,255,255,.20); }
  .appr .deny { color: #FB7185; border: 1px solid rgba(251,113,133,.36); }

  #note { display: none; margin: 0 12px 10px; padding: 9px 13px; border-radius: 13px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: var(--ink);
    font-size: 12.5px; -webkit-app-region: no-drag; animation: rise .25s ease; }
  #note.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #island, #panel, button { transition: none !important; }
    #island::before { animation: none !important; }
  }
</style>
</head>
<body data-state="idle">
  <div id="island" data-open="0">
    <div class="pill" title="Drag to move — Esc hides">
      <!-- the wisp mark, not a sparkle: the running border is the only spinner -->
      <svg viewBox="0 0 24 24"><path d="M3 8c3.2 0 3.2 8 6.4 8S12.6 8 15.8 8 19 16 21 16"/></svg>
      <span id="ptext">wisp</span>
    </div>
    <div id="panel"><div class="inner">
      <div class="row">
        <input id="q" placeholder='Ask anything · "run …" hands it to the agents' aria-label="Ask Wisp">
        <button id="mic" aria-label="Talk to Wisp" title="Talk to Wisp">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button id="undo" aria-label="Undo last agent action" title="Ask the agents to undo their last action">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="stop" aria-label="Stop all running work" title="Stop everything">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="open" aria-label="Open dashboard" title="Open dashboard">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
      </div>
      <div id="answer" role="log"></div>
      <div id="approvals"></div>
      <div id="note" role="status"></div>
    </div></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const island = $("island"), q = $("q"), ptext = $("ptext"),
        answer = $("answer"), note = $("note"), approvalsBox = $("approvals");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let state = "idle", running = [], history = [], fromVoice = false;
  /* ── the morph: one element, one spring, three properties ──────────────
     Width, height and radius all lerp off a single spring so the island is a
     single object deforming and never two elements swapping. The window
     follows once per transition (never per frame — that would jank). */
  const ISLAND_SPRING = { k: 380, c: 30, m: 0.9 };
  // the window hugs the island: just enough room for the drop shadow, so there
  // is no wide transparent halo sitting on top of whatever is behind it
  const MARGIN = 18;
  const SIZE = { dormant:[200,34,999], listening:[420,48,999], thinking:[460,52,999],
                 working:[520,64,26],  live:[320,38,999],      peek:[560,200,24],
                 toast:[340,52,18],    minimized:[56,28,999] };
  const RMOTION = matchMedia("(prefers-reduced-motion: reduce)");
  const islandEl = document.getElementById("island");
  let cur = { w:200, h:34, r:999 }, stopMorph = null, morphOff = 0, islandState = "dormant";

  function springTo(target, cfg, onFrame) {
    if (RMOTION.matches) { onFrame(1); return () => {}; }
    let x = 0, v = 0, raf = 0, last = performance.now();
    (function step(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
      for (let i = 0; i < 2; i++) {
        const h = dt / 2;
        v += ((-cfg.k * (x - target) - cfg.c * v) / cfg.m) * h;
        x += v * h;
      }
      onFrame(x);
      if (Math.abs(x - target) < 0.002 && Math.abs(v) < 0.02) return onFrame(target);
      raf = requestAnimationFrame(step);
    })(last);
    return () => cancelAnimationFrame(raf);
  }

  function morph(next) {
    if (!SIZE[next] || next === islandState) return;
    const [w, h, r] = SIZE[next], from = { ...cur };
    islandState = next;
    document.body.dataset.island = next;
    // the window is sized to the LARGER of the two states before the spring
    // starts, so the island is never clipped mid-morph
    if (window.wisp && window.wisp.bounds)
      window.wisp.bounds(Math.max(from.w, w) + MARGIN * 2, Math.max(from.h, h) + MARGIN * 2);
    islandEl.classList.add("morphing");
    clearTimeout(morphOff);
    morphOff = setTimeout(() => islandEl.classList.remove("morphing"),
                          RMOTION.matches ? 0 : 120);
    stopMorph && stopMorph();
    stopMorph = springTo(1, ISLAND_SPRING, (t) => {
      cur.w = from.w + (w - from.w) * t;
      cur.h = from.h + (h - from.h) * t;
      cur.r = from.r + (r - from.r) * t;
      islandEl.style.width = cur.w.toFixed(1) + "px";
      islandEl.style.minHeight = cur.h.toFixed(1) + "px";
      islandEl.style.borderRadius = cur.r.toFixed(1) + "px";
      if (t > 0.999 && window.wisp && window.wisp.bounds)
        window.wisp.bounds(w + MARGIN * 2, h + MARGIN * 2);  // settle onto the state
    });
  }
  window.islandState = (s) => { morph(s); return islandState; };

  // No click-through: setIgnoreMouseEvents also swallows mousedown, so the
  // island became undraggable. The window hugs the island instead (MARGIN).

  /* ── drag and click, from the renderer ──────────────────────────────────
     The pill used to be an OS drag region, which never delivers a click. Now
     the island moves its own window on pointer drag, and anything under the
     4px threshold is treated as a click instead. */
  (function () {
    let down = null;
    islandEl.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest("button, input, #answer, .appr")) return;
      down = { x: e.screenX, y: e.screenY, moved: 0 };
      islandEl.setPointerCapture(e.pointerId);
    });
    islandEl.addEventListener("pointermove", (e) => {
      if (!down) return;
      const dx = e.screenX - down.x, dy = e.screenY - down.y;
      if (!dx && !dy) return;
      down.moved += Math.abs(dx) + Math.abs(dy);
      down.x = e.screenX; down.y = e.screenY;
      window.wisp && window.wisp.move && window.wisp.move(dx, dy);
    });
    const end = (e) => {
      if (!down) return;
      const wasClick = down.moved < 4;
      down = null;
      try { islandEl.releasePointerCapture(e.pointerId); } catch (_) {}
      if (wasClick) island.dataset.open === "1" ? closeNow() : open();
    };
    islandEl.addEventListener("pointerup", end);
    islandEl.addEventListener("pointercancel", end);
  })();

  function closeNow() {
    clearTimeout(closeTimer);
    island.dataset.open = "0";
    morph(STATE_ISLAND[state] || "dormant");
    setTimeout(fit, 320);
  }

  // activity states map onto the island's vocabulary
  const STATE_ISLAND = { idle:"dormant", listening:"listening", thinking:"thinking",
                         working:"working" };
  const setState = (s) => {
    state = s; document.body.dataset.state = s;
    if (island.dataset.open !== "1") morph(STATE_ISLAND[s] || "dormant");
  };

  // peek is the one state that sizes to its payload (560 × auto, capped at 320)
  const fit = () => requestAnimationFrame(() => {
    if (!window.wisp) return;
    if (islandState === "peek") {
      const inner = island.querySelector("#panel .inner");
      const h = Math.max(44, Math.min(320,
        Math.ceil((inner ? inner.getBoundingClientRect().height : 0) + 52)));
      cur.h = h;
      island.style.minHeight = h + "px";
      window.wisp.bounds && window.wisp.bounds(560 + MARGIN * 2, h + MARGIN * 2);
    } else {
      window.wisp.bounds && window.wisp.bounds(cur.w + MARGIN * 2, cur.h + MARGIN * 2);
    }
  });

  // ── morph open/close ──
  let closeTimer = 0;
  function open() { clearTimeout(closeTimer); island.dataset.open = "1"; morph("peek");
                    fit(); setTimeout(fit, 320); }
  function maybeClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      const busy = state !== "idle" || answer.classList.contains("show") ||
                   approvalsBox.children.length || note.classList.contains("show") ||
                   document.activeElement === q;
      if (!busy) {
        island.dataset.open = "0";
        morph(STATE_ISLAND[state] || "dormant");
        setTimeout(fit, 320);
      }
    }, 700);
  }
  island.addEventListener("mouseenter", open);
  island.addEventListener("mouseleave", maybeClose);
  island.addEventListener("focusin", open);

  function pill(text) { ptext.textContent = text; }

  /* ── markdown ────────────────────────────────────────────────────────────
     Model replies are markdown. They were being written in with textContent,
     so every **bold** and bullet showed its syntax. Escape first — this is
     untrusted model output going into innerHTML — then render the subset that
     actually turns up in a reply. */
  function md(src) {
    const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const code = [];
    let t = esc(String(src || "").trim())
      .replace(/```(\w*)\n?([\s\S]*?)```/g, (_m, _lang, body) =>
        "␀" + (code.push("<pre><code>" + body.replace(/\n$/, "") + "</code></pre>") - 1) + "␀");
    t = t
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    // a list usually follows its lead-in line with no blank line between them,
    // so blocks are scanned line by line rather than classified whole
    const BULLET = /^\s*([-*+]|\d+\.)\s+/;
    const out = t.split(/\n{2,}/).map((block) => {
      let html = "", para = [], list = [];
      const flushP = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
      const flushL = () => { if (list.length) { html += "<ul>" + list.join("") + "</ul>"; list = []; } };
      for (const line of block.split("\n")) {
        if (BULLET.test(line)) { flushP(); list.push("<li>" + line.replace(BULLET, "") + "</li>"); }
        else if (/^#{1,6}\s/.test(line)) { flushP(); flushL(); html += "<h3>" + line.replace(/^#{1,6}\s*/, "") + "</h3>"; }
        else { flushL(); if (line.trim()) para.push(line); }
      }
      flushP(); flushL();
      return html;
    }).join("");
    return out.replace(/␀(\d+)␀/g, (_m, i) => code[+i]);
  }

  // ── status like a real assistant, then the actual answer ──
  let statusTimer = 0;
  function stage(texts, i = 0) {
    clearTimeout(statusTimer);
    pill(texts[i]);
    if (i < texts.length - 1)
      statusTimer = setTimeout(() => stage(texts, i + 1), i === 0 ? 750 : 5000);
  }
  function idlePill() {
    clearTimeout(statusTimer);
    // dormant is 200px wide: it carries the mark and a word, nothing more
    pill(running.length
      ? running.length + " running — " + running.map((x) => x.title).join(" · ")
      : "wisp");
  }

  const speak = (t) => { try { speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(t)); } catch (_) {} };

  function toast(html) {
    note.innerHTML = html; note.classList.add("show"); open(); fit();
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { note.classList.remove("show"); fit(); maybeClose(); }, 6000);
    if (Notification.permission === "granted")
      new Notification("Wisp", { body: note.textContent, silent: true });
  }

  async function api(path, body) {
    const r = await fetch(path, body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
  }

  // ── ask: instant chat answer; "run …" hands off to the agents ──
  async function send(text) {
    const t = text.trim();
    if (!t) return;
    const voice = fromVoice; fromVoice = false;
    if (/^(stop|cancel|abort)\b/i.test(t)) return stopAll();
    if (/^undo\b/i.test(t)) return undo();
    if (/^(run|mission)[:\s]/i.test(t)) {
      const goal = t.replace(/^(run|mission)[:\s]+/i, "");
      const r = await api("/api/message", { text: goal, source: "minibar" });
      toast(r.ok ? "<b>Handed to the agents.</b> Track it on the dashboard."
                 : "Engine error " + r.status);
      if (r.ok) q.value = "";
      return;
    }
    setState("thinking");
    stage(["Recalling the brain…", "Thinking about your prompt…",
           "Still thinking — long one…"]);
    const r = await api("/api/chat", { message: t, history });
    clearTimeout(statusTimer); setState("idle"); idlePill();
    if (!r.ok || !r.data.reply)
      return toast("Engine error: " + esc(r.data.error || r.status));
    history.push({ role: "user", content: t },
                 { role: "assistant", content: r.data.reply });
    history = history.slice(-12);
    answer.innerHTML = md(r.data.reply);
    answer.classList.add("show"); open(); fit();
    q.value = ""; q.focus();
    if (voice) speak(r.data.reply.split(/(?<=[.!?])\s/)[0].slice(0, 220));
  }

  async function stopAll() {
    const r = await api("/api/stop-all", {});
    const n = (r.data.stopped || []).length;
    toast("<b>Stopped.</b> " + n + " task" + (n === 1 ? "" : "s") + " halted.");
  }
  async function undo() {
    const r = await api("/api/message",
      { text: "Undo the last action you performed and report what was reverted.",
        source: "minibar-undo" });
    toast(r.ok ? "<b>Undo requested.</b>" : "Engine error " + r.status);
  }

  // ── voice: click to talk, click again to finish; replies are spoken ──
  let rec = null, chunks = [];
  $("mic").addEventListener("click", async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      rec = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        $("mic").classList.remove("live");
        const blob = new Blob(chunks, { type: "audio/webm" });
        rec = null;
        if (blob.size < 2000) { setState("idle"); idlePill(); return; }
        stage(["Transcribing…"]); setState("thinking");
        const buf = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < buf.length; i += 0x8000)
          bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        const r = await api("/api/voice", { audio_b64: btoa(bin) });
        setState("idle"); idlePill();
        if (r.status === 501) return toast("<b>Whisper missing.</b> pip install faster-whisper");
        if (!r.ok || !r.data.text) return toast("Didn't catch that.");
        q.value = r.data.text; fromVoice = true;
        send(r.data.text);
      };
      rec.start();
      $("mic").classList.add("live");
      setState("listening"); pill("Listening — click the mic to finish"); open();
    } catch (_) { toast("<b>Microphone unavailable.</b>"); }
  });

  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send(q.value);
    if (e.key === "Escape" && answer.classList.contains("show")) {
      answer.classList.remove("show"); fit(); e.stopPropagation();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") window.wisp && window.wisp.hide();
  });
  $("stop").addEventListener("click", stopAll);
  $("undo").addEventListener("click", undo);
  $("open").addEventListener("click", () => window.wisp && window.wisp.openMain());

  // ── approval queue ──
  let seenApprovals = new Set();
  function renderApprovals(list) {
    const ids = new Set(list.map((a) => a.request_id));
    for (const a of list)
      if (!seenApprovals.has(a.request_id) && Notification.permission === "granted")
        new Notification("Wisp — approval needed", { body: a.summary });
    seenApprovals = ids;
    approvalsBox.innerHTML = list.map((a) => `
      <div class="appr" data-rid="${esc(a.request_id)}">
        <div class="who">${esc(a.mission)}${a.kind === "credential" ? " — credentials" : ""}</div>
        <div class="what">${esc(a.summary)}</div>
        <div class="acts">
          ${a.can_authorize ? `<button class="allow" data-act="allow">Allow &amp; resume</button>` : ""}
          <button class="retry" data-act="retry">Retry after fixing</button>
          ${a.can_authorize ? `<button class="deny" data-act="deny">Deny &amp; skip</button>` : ""}
        </div>
      </div>`).join("");
    if (list.length) open();
    approvalsBox.querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", async () => {
        const a = list.find((x) => x.request_id === b.closest(".appr").dataset.rid);
        if (!a) return;
        b.disabled = true;
        const r = await api("/api/ceo-action",
          { cid: a.cid, role: a.role, action: b.dataset.act, request_id: a.request_id });
        toast(r.ok ? "<b>" + b.textContent + ".</b>" : "Rejected: " + esc(r.data.error || r.status));
        poll();
      }));
    fit();
  }

  // ── live activity + completion notifications ──
  let wasRunning = new Map();
  async function poll() {
    try {
      const { data } = await api("/api/activity");
      renderApprovals(data.approvals || []);
      running = data.running || [];
      if (running.length && state === "idle") setState("working");
      if (!running.length && state === "working") setState("idle");
      if (state === "idle" || state === "working") idlePill();
      for (const item of data.recent || []) {
        if (wasRunning.has(item.id)) {
          wasRunning.delete(item.id);
          const good = /done|accept/.test(item.status);
          toast("<b>" + (good ? "Finished" : "Ended (" + item.status + ")") + ":</b> " +
                esc(item.title));
        }
      }
      running.forEach((x) => wasRunning.set(x.id, 1));
    } catch (_) { /* engine offline */ }
  }
  setInterval(poll, 4000); poll();

  async function brief() {
    try {
      const { data } = await api("/api/briefing");
      const id = data && data.batch && data.batch.id;
      if (id && localStorage.getItem("wisp-brief") !== id) {
        localStorage.setItem("wisp-brief", id);
        toast("<b>Daily brief is ready.</b> Open the dashboard to read it.");
      }
    } catch (_) {}
  }
  setInterval(brief, 10 * 60 * 1000); brief();

  if (Notification.permission === "default") Notification.requestPermission();
  idlePill(); fit();
</script>
</body>
</html>
